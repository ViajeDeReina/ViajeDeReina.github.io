<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>정보처리기사 문제풀이</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1c1f26; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --ok:#16a34a; --ok-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdeaea; --box:#f1f5fb;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --card:#1b1e26; --text:#e8eaef; --muted:#9aa1ae; --line:#2c303b;
    --accent:#6ea0ff; --ok:#4ade80; --ok-bg:#16301f; --bad:#f87171; --bad-bg:#3a1c1e; --box:#222733;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --card:#1b1e26; --text:#e8eaef; --muted:#9aa1ae; --line:#2c303b;
  --accent:#6ea0ff; --ok:#4ade80; --ok-bg:#16301f; --bad:#f87171; --bad-bg:#3a1c1e; --box:#222733;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
.row{display:flex;gap:8px;align-items:center}
select,button{font:inherit;color:var(--text)}
select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#subject{flex:2}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.stats{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:8px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.star{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.star.on{color:#f59e0b}
.q{font-weight:600;font-size:17px;white-space:pre-wrap;margin:0 0 12px}
.box{background:var(--box);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;font-size:15px}
.imgs img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 0 12px;background:#fff}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin:0 0 8px;cursor:pointer}
.choice .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice.bad .n{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice:disabled{cursor:default;opacity:1}
.result{font-weight:700;margin:4px 0 8px}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.exp{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:15px}
.exp p{margin:0 0 4px}
.exp p.h{font-weight:700;margin-top:6px}
.exp table{border-collapse:collapse;width:100%;margin:6px 0;font-size:14px}
.exp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.exp td:first-child{font-weight:600;background:var(--box);white-space:nowrap}
.exp td.wide{white-space:normal}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.nav .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav.col{flex-direction:column}
.nav button:disabled{opacity:.5;cursor:default}
.done-title{font-size:22px;font-weight:700;text-align:center;margin:8px 0}
.done-sum{text-align:center;margin:0 0 8px}
.empty{text-align:center;color:var(--muted);padding:40px 8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(92vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px}
dialog textarea{width:100%;height:140px;font:12px/1.4 monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:8px}
dialog .row{margin-top:8px;flex-wrap:wrap}
dialog small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="row">
    <select id="subject" aria-label="과목"></select>
    <select id="mode" aria-label="모드">
      <option value="all">전체</option>
      <option value="wrong">오답만</option>
      <option value="star">★ 별표만</option>
    </select>
    <button class="icon-btn" id="menu" aria-label="메뉴">⋯</button>
  </div>
  <div class="stats"><span id="s-pos"></span><span id="s-rec"></span></div>
</header>
<main id="main"></main>

<dialog id="dlg">
  <h3>학습 기록 · 설정</h3>
  <small>틀린 문제와 별표는 이 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 기록을 지우기 전에 내보내 두세요.</small>
  <textarea id="data" spellcheck="false"></textarea>
  <div class="row">
    <button class="icon-btn" id="copy">복사</button>
    <button class="icon-btn" id="save">파일로 저장</button>
    <button class="icon-btn" id="import">붙여넣은 내용 가져오기</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button class="icon-btn" id="load">파일 가져오기</button>
  </div>
  <div class="row">
    <button class="icon-btn" id="theme">화면 테마 전환</button>
    <button class="icon-btn" id="close" style="margin-left:auto">닫기</button>
  </div>
  <div class="row">
    <button class="icon-btn" id="reset-round">이 범위 진행 초기화</button>
    <button class="icon-btn" id="reset-all">전체 초기화 (오답·별표 포함)</button>
  </div>
  <div id="msg" style="margin-top:8px;font-size:13px;color:var(--muted)"></div>
</dialog>

<script>
"use strict";
const KEY = "exam2027.v1";
const $ = id => document.getElementById(id);
let Q = [], byKey = {}, R = null, view = "empty", answered = false;

// ---------- 저장소 ----------
// rounds: 범위("과목|모드")별 한 바퀴 상태 {order: 문제 키 순서, pos: 현재 위치, res: {키: {pick, ok}}}
const blank = () => ({wrong: [], star: [], done: [], rounds: {}, subject: "all", mode: "all", theme: ""});
let S = blank();
function load() {
  try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = blank(); }
  if (S.mode !== "wrong" && S.mode !== "star") S.mode = "all";
  if (!S.rounds || typeof S.rounds !== "object") S.rounds = {};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const has = (list, k) => list.includes(k);
function toggle(list, k, on) {
  const i = list.indexOf(k);
  if (on && i < 0) list.push(k);
  if (!on && i >= 0) list.splice(i, 1);
}

// ---------- 큐 ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pool() {
  return Q.filter(q => {
    if (S.subject !== "all" && q.subject !== S.subject) return false;
    if (S.mode === "wrong") return has(S.wrong, q.key);
    if (S.mode === "star") return has(S.star, q.key);
    return true;
  });
}

// ---------- 한 바퀴(라운드) ----------
// 범위의 문제를 한 번 섞어 순서를 저장하고, 그 순서대로 한 번씩만 낸다. 앱을 닫아도 이어진다.
const scopeId = () => S.subject + "|" + S.mode;
function ensureRound() {
  const id = scopeId(), keys = pool().map(q => q.key);
  let r = S.rounds[id];
  if (!r) {
    if (!keys.length) return null;
    r = S.rounds[id] = {order: shuffle(keys.slice()), pos: 0, res: {}};
    save();
    return r;
  }
  // 엑셀에서 삭제된 문제는 빼고, 전체 모드에서는 새로 생긴 문제를 남은 순서 뒤에 섞어 붙인다.
  const set = new Set(keys);
  const keep = k => byKey[k] && (S.mode !== "all" || set.has(k));
  const before = r.order.slice(0, r.pos).filter(keep).length;
  r.order = r.order.filter(keep);
  if (S.mode === "all") {
    const have = new Set(r.order);
    r.order.push(...shuffle(keys.filter(k => !have.has(k))));
  }
  r.pos = Math.min(before, r.order.length);
  for (const k of Object.keys(r.res)) if (!r.order.includes(k)) delete r.res[k];
  if (!r.order.length) { delete S.rounds[id]; save(); return null; }
  save();
  return r;
}
// 범위/모드를 바꿔 들어올 때: 이미 끝난 오답·별표 바퀴는 새로 시작한다.
function rebuild() {
  const r = S.rounds[scopeId()];
  if (r && S.mode !== "all" && r.pos >= r.order.length) delete S.rounds[scopeId()];
  render();
}

// ---------- 렌더링 ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// 해설 행(D~F열)을 문단/표로 변환. 줄바꿈 때문에 쪼개진 셀은 앞 행에 이어붙인다.
function renderExplanation(rows) {
  if (!rows.length) return "";
  const multi = r => r.filter(c => c !== "").length >= 2 || (r.length >= 2 && r[0] === "");
  const first = rows.findIndex(multi);
  let last = -1;
  rows.forEach((r, i) => { if (multi(r)) last = i; });
  const para = r => (r[0].startsWith("*") ? `<p class="h">${esc(r[0])}</p>` : `<p>${esc(r[0])}</p>`);
  if (first < 0) return rows.map(r => para(r.length ? r : [""])).join("");

  const join = (a, b) => !b ? a : !a ? b : /-$/.test(a) && /^[a-z]/.test(b) ? a.slice(0, -1) + b : a + " " + b;
  const unbalanced = s => (s.match(/\(/g) || []).length > (s.match(/\)/g) || []).length;
  const table = [];
  for (let i = first; i <= last; i++) {
    const r = rows[i];
    const prev = table[table.length - 1];
    const cont = prev && (r[0] === "" || r[0].startsWith("(") || /-$/.test(prev[0]) || unbalanced(prev[0]));
    if (cont) r.forEach((c, k) => { prev[k] = join(prev[k] || "", c); });
    else table.push(r.slice());
  }
  const cols = Math.max(...table.map(r => r.length));
  const tr = r => "<tr>" + Array.from({length: cols}, (_, k) =>
    `<td${k ? ' class="wide"' : ""}>${esc(r[k] || "")}</td>`).join("") + "</tr>";
  return rows.slice(0, first).map(r => para(r)).join("") +
    `<table>${table.map(tr).join("")}</table>` +
    rows.slice(last + 1).map(r => para(r)).join("");
}

function render() {
  const main = $("main");
  R = ensureRound();
  if (!R) {
    view = "empty"; stats();
    const msg = {wrong: "틀린 문제가 없습니다.", star: "별표한 문제가 없습니다.", all: "문제가 없습니다."}[S.mode];
    main.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  if (R.pos >= R.order.length) { view = "result"; stats(); showResult(); return; }
  view = "q"; stats();
  const q = byKey[R.order[R.pos]];
  answered = false;
  main.innerHTML = `
  <div class="card">
    <div class="meta"><span>${esc(q.subject.replace("-", " "))}${q.chapterNo ? ` · Chapter ${q.chapterNo} ${esc(q.chapterTitle)}` : ""} · ${q.num}번</span>
      <button class="star ${has(S.star, q.key) ? "on" : ""}" id="star" aria-label="별표">${has(S.star, q.key) ? "★" : "☆"}</button></div>
    <p class="q">${esc(q.question)}</p>
    ${(q.box || []).length ? `<div class="box">${esc(q.box.join("\n"))}</div>` : ""}
    ${(q.images || []).length ? `<div class="imgs">${q.images.map(s => `<img src="${esc(s)}" alt="문제 이미지">`).join("")}</div>` : ""}
    <div id="choices">${q.choices.map((c, i) => `<button class="choice" data-i="${i + 1}"><span class="n">${i + 1}</span><span>${esc(c)}</span></button>`).join("")}</div>
    <div id="after"></div>
  </div>
  <div class="nav"><button id="prev">이전</button><button class="primary" id="next">${R.pos + 1 >= R.order.length ? "결과 보기" : "다음 문제"}</button></div>`;
  $("star").onclick = () => {
    const on = !has(S.star, q.key); toggle(S.star, q.key, on); save();
    $("star").classList.toggle("on", on); $("star").textContent = on ? "★" : "☆"; stats();
  };
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("prev").onclick = prev; $("next").onclick = next;
  const prevRes = R.res[q.key];
  if (prevRes) { answered = true; reveal(q, prevRes.pick); }  // 이전에 푼 문제로 돌아온 경우 선택/해설을 다시 보여준다
  window.scrollTo(0, 0);
}
// 상단 숫자: 현재 범위의 이번 한 바퀴 진행도
function stats() {
  const n = R ? R.order.length : 0;
  $("s-pos").textContent = !n ? "0 / 0" : view === "result" ? `완료 ${n} / ${n}` : `${R.pos + 1} / ${n}`;
  const res = R ? Object.values(R.res) : [];
  const ok = res.filter(x => x.ok).length;
  $("s-rec").textContent = `정답 ${ok} · 오답 ${res.length - ok} · ★ ${S.star.filter(k => byKey[k]).length}`;
}

function showResult() {
  const n = R.order.length, vals = R.order.map(k => R.res[k]);
  const ok = vals.filter(v => v && v.ok).length, bad = vals.filter(v => v && !v.ok).length, skip = n - ok - bad;
  const wrongLeft = S.wrong.filter(k => byKey[k] && (S.subject === "all" || byKey[k].subject === S.subject)).length;
  $("main").innerHTML = `
  <div class="card">
    <div class="done-title">수고하셨습니다!</div>
    <p class="done-sum">총 <b>${n}</b>문제 중 정답 <b>${ok}</b> · 오답 <b>${bad}</b>${skip ? ` · 건너뜀 <b>${skip}</b>` : ""}<br>정답률 ${Math.round(ok / n * 100)}%</p>
    <div class="nav col">
      <button id="r-wrong" ${wrongLeft ? "" : "disabled"}>${wrongLeft ? `오답만 다시 풀기 (${wrongLeft}문제)` : "남은 오답이 없습니다"}</button>
      ${skip ? `<button id="r-skip">건너뛴 문제 풀기 (${skip}문제)</button>` : ""}
      <button class="primary" id="r-again">처음부터 다시 (순서 새로 섞기)</button>
      <button id="prev">마지막 문제 다시 보기</button>
    </div>
  </div>`;
  $("prev").onclick = prev;
  $("r-again").onclick = () => { delete S.rounds[scopeId()]; save(); render(); };
  $("r-wrong").onclick = () => {
    S.mode = "wrong"; $("mode").value = "wrong";
    delete S.rounds[scopeId()]; save(); render();
  };
  if (skip) $("r-skip").onclick = () => {
    R.order = [...R.order.filter(k => R.res[k]), ...R.order.filter(k => !R.res[k])];
    R.pos = n - skip; save(); render();
  };
  window.scrollTo(0, 0);
}

function answer(n) {
  if (answered) return;
  answered = true;
  const q = byKey[R.order[R.pos]];
  if (q.answer != null) {
    const ok = n === q.answer;
    R.res[q.key] = {pick: n, ok};
    toggle(S.wrong, q.key, !ok); toggle(S.done, q.key, true); save();
  }
  reveal(q, n);
  stats();
}

// 선택 결과와 해설을 화면에 표시 (기록은 answer()에서만 한다)
function reveal(q, n) {
  document.querySelectorAll(".choice").forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    if (i === q.answer) b.classList.add("ok");
    else if (i === n) b.classList.add("bad");
  });
  let head;
  if (q.answer == null) head = `<div class="result">정답 정보가 없습니다.</div>`;
  else {
    head = n === q.answer ? `<div class="result ok">정답입니다</div>` : `<div class="result bad">오답 · 정답은 ${q.answer}번</div>`;
  }
  const exp = renderExplanation(q.explanation || []);
  $("after").innerHTML = head + (exp ? `<div class="exp">${exp}</div>` : "");
}

function next() { if (view === "q") { R.pos++; save(); render(); } }
function prev() {
  if (view === "q" && R.pos > 0) R.pos--;
  else if (view === "result") R.pos = R.order.length - 1;
  else return;
  save(); render();
}

// ---------- 이벤트 ----------
let tx = null, ty = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
document.addEventListener("touchend", e => {
  if (tx == null || e.target.closest("dialog,table")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) dx < 0 ? next() : prev();
}, {passive: true});
document.addEventListener("keydown", e => {
  if (e.target.closest("dialog,select,textarea") || !R) return;
  if (/^[1-4]$/.test(e.key)) { if (view === "q") answer(+e.key); }
  else if (e.key === "ArrowRight" || e.key === "Enter") next();
  else if (e.key === "ArrowLeft") prev();
});

function fillSubjects() {
  const subs = [...new Set(Q.map(q => q.subject))];
  $("subject").innerHTML = `<option value="all">전체 과목 (${Q.length})</option>` +
    subs.map(s => `<option value="${esc(s)}">${esc(s)} (${Q.filter(q => q.subject === s).length})</option>`).join("");
  if (S.subject !== "all" && !subs.includes(S.subject)) S.subject = "all";
  $("subject").value = S.subject; $("mode").value = S.mode;
}
$("subject").onchange = e => { S.subject = e.target.value; save(); rebuild(); };
$("mode").onchange = e => { S.mode = e.target.value; save(); rebuild(); };

// ---------- 기록 내보내기/가져오기 ----------
const dlg = $("dlg");
const exportData = () => JSON.stringify({wrong: S.wrong, star: S.star, done: S.done});
const say = t => { $("msg").textContent = t; };
$("menu").onclick = () => {
  $("data").value = exportData();
  say(`누적 오답 ${S.wrong.filter(k => byKey[k]).length}문제 · 별표 ${S.star.filter(k => byKey[k]).length}문제`);
  dlg.showModal();
};
$("close").onclick = () => dlg.close();
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(exportData()); say("복사했습니다."); }
  catch (e) { $("data").select(); say("선택된 내용을 직접 복사하세요."); }
};
$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([exportData()], {type: "application/json"}));
  a.download = "exam-progress.json"; a.click();
};
function importText(t) {
  try {
    const d = JSON.parse(t);
    for (const k of ["wrong", "star", "done"]) if (Array.isArray(d[k])) d[k].forEach(x => toggle(S[k], x, true));
    save(); rebuild(); stats(); say("가져왔습니다. (기존 기록과 합쳐졌습니다)");
  } catch (e) { say("형식이 올바르지 않습니다."); }
}
$("import").onclick = () => importText($("data").value);
$("load").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; if (f) importText(await f.text()); };
$("reset-round").onclick = () => {
  if (!confirm("지금 선택한 과목·모드의 진행 상황을 처음부터 다시 시작할까요? (오답·별표 기록은 유지)")) return;
  delete S.rounds[scopeId()]; save(); render(); dlg.close();
};
$("reset-all").onclick = () => {
  if (!confirm("모든 진행 상황과 오답·별표 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
  S.wrong = []; S.star = []; S.done = []; S.rounds = {}; save(); render();
  $("data").value = exportData(); say("전체 초기화했습니다.");
};
function applyTheme() { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
$("theme").onclick = () => {
  const dark = (S.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  S.theme = dark ? "light" : "dark"; save(); applyTheme();
};

// ---------- 시작 ----------
(async function init() {
  load(); applyTheme();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try {
    Q = await (await fetch("questions.json", {cache: "no-cache"})).json();
  } catch (e) {
    $("main").innerHTML = `<div class="empty">questions.json을 불러오지 못했습니다.<br>(파일을 직접 열었다면 웹 서버나 GitHub Pages로 접속하세요)</div>`;
    return;
  }
  Q.forEach(q => byKey[q.key] = q);
  fillSubjects(); rebuild();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
